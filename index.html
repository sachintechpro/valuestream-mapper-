nale, authority approval and customer communication"];sample.pillars[6].entries=["Monthly volume: approximately 1,200 new claims; seasonal peaks may be 1.5× normal demand","Current illustrative median lead time: 12 calendar days (288 elapsed hours)","Current touch time: 18.5 hours across the seven mapped steps; flow efficiency approximately 6.4%","First-time-complete FNOL: 82%; rework incidence: 18%; customer status-chasing: 22 calls per 100 claims","Proposed future target: 4 calendar days; 24 touch hours; 25% flow efficiency; targets require pilot validation"];sample.pillars[7].entries=["Illustrative fully loaded operational cost: $145 per claim for the mapped process segment","Estimated avoidable rework effort: 2.5 hours per affected claim; validate with time study","Potential capacity released is not automatically a cash saving; Finance must validate redeployment or cost takeout","Improvement funding should be released in stages against measured cycle-time, quality and customer outcomes","No benefit is booked until baseline, attribution, adoption and control impact are agreed"];sample.people=[{name:"Elena Ramirez",role:"VP — Commercial Claims (Executive Sponsor / Value Stream Owner)"},{name:"Marcus Lee",role:"Director — Property Claims Operations (Process Owner)"},{name:"Priya Nair",role:"Senior Manager — FNOL & Intake"},{name:"Daniel Brooks",role:"Claims Team Lead — Property"},{name:"Alicia Chen",role:"Senior Property Adjuster (Frontline SME)"},{name:"Robert King",role:"Coverage Specialist"},{name:"Maya Patel",role:"Product Owner — Claims Platforms"},{name:"Jordan Ellis",role:"Enterprise Solution Architect"},{name:"Nina Shah",role:"Claims Data & Reporting Lead"},{name:"Thomas Reed",role:"Risk & Compliance Manager"},{name:"Olivia Grant",role:"Finance Business Partner"},{name:"Ethan Cole",role:"Value Stream Facilitator / Business Analyst"}];sample.current=[["FNOL received & acknowledged","FNOL intake team",0.75,8,42,5,"Broker portal, customer form, ClaimCenter","Value-added","Customer / broker submits claim"],["Validate policy & completeness","Claims associate",1.5,36,68,18,"ClaimCenter, policy administration, document management","Business-required","Missing or inconsistent FNOL data"],["Triage & assign adjuster","Claims team lead",0.5,48,55,4,"ClaimCenter, workload queue","Business-required","Capacity and skill-based assignment"],["Coverage & initial reserve review","Assigned adjuster / coverage specialist",3,48,34,8,"ClaimCenter, policy administration, authority matrix","Business-required","Coverage exception referral"],["Investigate loss & collect evidence","Property adjuster",8,96,29,12,"ClaimCenter, document management, vendor estimate","Value-added","Customer, broker and repair vendor evidence"],["Review estimate & approve authority","Adjuster / claims manager",3.5,40,21,6,"Estimating tool, ClaimCenter, approval workflow","Business-required","Estimate variance or authority threshold"],["Communicate decision & next steps","Claims associate / adjuster",1.25,12,14,3,"ClaimCenter, email, broker portal","Value-added","Decision, rationale and customer next action"]].map(function(a){return{id:uid(),name:a[0],owner:a[1],process:a[2],wait:a[3],queue:a[4],rework:a[5],systems:a[6],value:a[7],description:a[8],dependencies:"Policy and claim data quality; adjuster capacity; customer / broker response; authority rules"}});sample.future=sample.current.map(function(a,i){var waits=[4,12,12,12,36,12,8],procs=[0.5,1,0.35,3,8,3.5,1.5];return Object.assign({},a,{id:uid(),process:procs[i],wait:waits[i],queue:Math.max(3,Math.round(a.queue*.35)),rework:Math.max(2,Math.round(a.rework*.4)),description:["Guided FNOL with mandatory-field validation and immediate receipt confirmation","Automated policy prefill and completeness rules; exceptions routed with reason codes","Rules-based triage with visible workload and skill-based assignment","Coverage checklist and digital referral for exceptions; no control bypass","Single evidence checklist, secure igh",status:"Proposed",benefit:"Reduce assignment queue from 48 hours to 12 hours while respecting skill and severity.",dependency:"Reliable workload, skill and severity data"},{title:"Evidence checklist and proactive reminders",type:"Epic",owner:"Priya Nair — FNOL & Intake",priority:"Medium",status:"Proposed",benefit:"Reduce customer / broker follow-up and evidence collection waiting.",dependency:"Customer communication preferences; document upload capability"},{title:"Digital authority and estimate review",type:"Feature",owner:"Marcus Lee — Process Owner",priority:"Medium",status:"Proposed",benefit:"Reduce approval wait and improve auditability without weakening delegated authority.",dependency:"Authority matrix and compliance sign-off"},{title:"Claims flow metrics and queue dashboard",type:"Enabler",owner:"Nina Shah — Data Lead",priority:"High",status:"In progress",benefit:"Measure queue age, touch time, rework, first-time completeness and customer updates.",dependency:"Event timestamps and consistent claim status definitions"},{title:"Customer decision communication templates",type:"Feature",owner:"Alicia Chen — Adjuster SME",priority:"Medium",status:"Proposed",benefit:"Improve decision clarity and reduce status-chasing contacts.",dependency:"Legal / compliance review of approved wording"}];sample.sessions=[{title:"Commercial Claims Value Stream Kickoff & Scope",kind:"Kickoff & scope alignment",date:"2026-10-05",roles:[{title:"Executive sponsor",attendance:"Mandatory"},{title:"Value stream owner",attendance:"Mandatory"},{title:"Business process owner",attendance:"Mandatory"},{title:"Facilitator",attendance:"Mandatory"},{title:"Product owner",attendance:"Optional"},{title:"Technology lead",attendance:"Optional"}],notes:"Agreed the customer outcome, FNOL-to-decision boundary, standard-claim scope and exclusions. Confirmed that the map must include broker, customer, operations and technology handoffs.",decisions:"Sponsor: Elena Ramirez. Process owner: Marcus Lee. Baseline to be validated with 8 weeks of claim event data. Catastrophe and litigated claims excluded from initial scope."},{title:"Discovery — People, Process, Systems and Controls",kind:"Value stream discovery",date:"2026-10-08",roles:[{title:"Value stream owner",attendance:"Mandatory"},{title:"Business process owner",attendance:"Mandatory"},{title:"Frontline subject matter expert",attendance:"Mandatory"},{title:"Facilitator",attendance:"Mandatory"},{title:"Application owner",attendance:"Mandatory"},{title:"Risk / compliance lead",attendance:"Optional"},{title:"Finance / portfolio lead",attendance:"Optional"}],notes:"Walked through three recent anonymized claim examples: standard, incomplete FNOL and coverage referral. Identified queue ownership gaps, duplicate document handling and data quality issues.",decisions:"Use one end-to-end claim journey as the map spine. Record exception paths separately. Validate timestamps, queue definitions and rework rate before baseline approval."},{title:"Current-State Mapping & Validation",kind:"Current-state mapping",date:"2026-10-13",roles:[{title:"Business process owner",attendance:"Mandatory"},{title:"Frontline subject matter expert",attendance:"Mandatory"},{title:"Facilitator",attendance:"Mandatory"},{title:"Business analyst",attendance:"Mandatory"},{title:"Application owner",attendance:"Mandatory"},{title:"Integration lead",attendance:"Optional"}],notes:"Mapped seven activities. Estimated 18.5 hours touch time and 288 hours elapsed waiting. Largest waits occur in intake completeness, adjuster assignment and evidence collection. Frontline SMEs challenged initial assumptions and added exception notes.",decisions:"Working baseline: 12 calendar days lead time, 18.5 touch hours, 6.4% flow efficiency. Figures are illustrative estimates pending event-data validation."},{title:"Future-State Design & Prioritization",kind:"Future-state design",date:"2026-10-20",roles:[{title:"Value stream owner",attendance:"Mandatory"},{title:"Business process owner",attendance:"Mandatory"},{title:"Frontline subject matter expert",attendance:"Mandatory"},{title:"Product owner",attendance:"Mandatory"},{title:"Solution architect",attendance:"Mandatory"},{title:"Risk / compliance lead",attendance:"Mandatory"},{title:"Finance / portfolio lead",attendance:"Optional"}],notes:"Designed guided intake, automated policy prefill, visible workload queues, structured evidence requests and digital authority routing. Preserved coverage, privacy and audit controls.",decisions:"Proposed target: 4 calendar days and approximately 25% flow efficiency. Pilot one region / claim segment; compare matched cohorts and monitor quality, customer complaints and control exceptions."},{title:"Leadership Playback & Investment Decision",kind:"Leadership decision / playback",date:"2026-10-27",roles:[{title:"Executive sponsor",attendance:"Mandatory"},{title:"Value stream owner",attendance:"Mandatory"},{title:"Business process owner",attendance:"Mandatory"},{title:"Product owner",attendance:"Mandatory"},{title:"Technology lead",attendance:"Mandatory"},{title:"Finance / portfolio lead",attendance:"Mandatory"},{title:"Risk / compliance lead",attendance:"Mandatory"}],notes:"Presented current-state evidence, future-state hypotheses, initiative dependencies, delivery sequencing and benefit measurement approach.",decisions:"Approve discovery-to-pilot planning subject to data baseline confirmation, security / compliance review and Finance validation of capacity assumptions."}];var data;try{data=JSON.parse(localStorage.getItem("vsm1"))}catch(e){}if(!data||!data.streams||data.version!==2)data={version:2,active:sample.id,streams:[sample]};else if(!data.streams.length)data={version:2,active:sample.id,streams:[sample]};var page="dashboard";

function field(n,l,v,t,full){var c='<div class="field '+(full?'full':'')+'"><label>'+l+'</label>';if(t==="textarea")c+='<textarea name="'+n+'">'+esc(v)+'</textarea>';else if(t==="select")c+='<select name="'+n+'"><option '+(v==="Business"?"selected":"")+'>Business</option><option '+(v==="Technology"?"selected":"")+'>Technology</option></select>';else c+='<input name="'+n+'" value="'+esc(v)+'">';return c+'</div>'}

function switchS(id){data.active=id;save();render()}function newStream(){var n=prompt("Name your new value stream");if(!n)return;var z=fresh();z.name=n;z.type=confirm("Is this a business value stream? Choose Cancel for a technology value stream.")?"Business":"Technology";data.streams.push(z);data.active=z.id;save();go("scope") }
document.addEventListener("submit",function(e){if(e.target.id==="sf"){e.preventDefault();Object.assign(S(),Object.fromEntries(new FormData(e.target)));save();render()}});
function pillar(i,k,v){S().pillars[i][k]=v;save();render()}function addPillarEntry(i){if(!S().pillars[i].entries)S().pillars[i].entries=S().pillars[i].note?[S().pillars[i].note]:[];S().pillars[i].entries.push("");save();render()}function pillarEntry(i,j,v){S().pillars[i].entries[j]=v;save()}function removePillarEntry(i,j){S().pillars[i].entries.splice(j,1);save();render()}function addPerson(){var n=prompt("Participant name");if(!n)return;S().people.push({name:n,role:prompt("Role")||"Participant"});save();render()}function delPerson(i){S().people.splice(i,1);save();render()}
var roleCatalog=["Executive sponsor","Business sponsor","Value stream owner","Business process owner","Product owner","Product manager","Project / program manager","Facilitator","Business analyst","Frontline subject matter expert","Operations manager","Claims / service representative","Solution architect","Technology lead","Application owner","Integration lead","Data / reporting lead","Risk / compliance lead","Finance / portfolio lead","Delivery team representative","Vendor / partner representative"];

function roleSelect(selected){return '<select class="role-title" style="flex:1;min-width:0;padding:8px;border:1px solid #ddd;border-radius:7px">'+roleCatalog.map(function(t){return '<option '+(t===selected?'selected':'')+'>'+t+'</option>'}).join("")+'</select>'}

function addMeetingRole(){document.getElementById("meetingRoles").insertAdjacentHTML("beforeend",roleRow("Project / program manager","Optional"))}
function addSession(){var f=document.getElementById("mf");document.getElementById("mt").textContent="Plan / record workshop";f.innerHTML='<div class="field"><label>Meeting title</label><input name="title" required placeholder="e.g. Current-state discovery"></div><div class="field"><label>Meeting type</label><select name="kind" id="meetingKind">'+Object.keys(meetingDefaults).map(function(k){return '<option>'+k+'</option>'}).join("")+'</select></div><div class="field"><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="section"><h2>Recommended participant titles</h2><button type="button" class="btn" onclick="addMeetingRole()">＋ Add title</button></div><div id="meetingRoles"></div><p class="note">Mandatory means required for the meeting’s purpose—not that every person in the overall RACI must attend. Consulted roles attend when their expertise is needed; Informed roles can receive the outcome afterward.</p><div class="field"><label>Observations / evidence</label><textarea name="notes"></textarea></div><div class="field"><label>Decisions / open questions</label><textarea name="decisions"></textarea></div><button class="btn primary">Save workshop</button>';document.getElementById("meetingKind").onchange=drawMeetingRoles;drawMeetingRoles();f.onsubmit=function(e){e.preventDefault();var fd=new FormData(f);var roles=Array.from(document.querySelectorAll("#meetingRoles .role-row")).map(function(row){return{title:row.querySelector(".role-title").value,attendance:row.querySelector(".role-attendance").value}});S().sessions.push({title:fd.get("title"),kind:fd.get("kind"),date:fd.get("date"),roles:roles,attendees:roles.map(function(a){return a.title+" ("+a.attendance+")"}).join(", "),notes:fd.get("notes"),decisions:fd.get("decisions")});save();closeModal();render()};document.getElementById("modal").classList.add("show")}function delSession(i){S().sessions.splice(i,1);save();render()}

function download(n,c,t){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function exportJSON(){download("value-stream-project.json",JSON.stringify(S(),null,2),"application/json")}function exportCSV(k){var a=S()[k],keys=k==="backlog"?["title","type","owner","priority","status","benefit","dependency"]:["name","owner","description","process","wait","queue","rework","systems","value","dependencies"];download(k+".csv",[keys.join(","),...a.map(function(z){return keys.map(function(q){return'"'+String(z[q]||"").replace(/"/g,'""')+'"'}).join(",")})].join("\n"),"text/csv")}
