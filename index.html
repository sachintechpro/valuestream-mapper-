t:750}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.check{display:flex;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0}.check small{display:block;color:var(--muted)}.flowwrap{overflow:auto;background:#fafcff;border:1px solid var(--line);border-radius:10px;padding:14px}.flow{display:flex;gap:13px;min-width:max-content}.step{width:190px;padding:12px;background:white;border:1px solid var(--line);border-radius:10px;position:relative}.step:after{content:"→";position:absolute;right:-14px;top:42%;color:#8b9ab0}.step:last-child:after{content:""}.step h3{font-size:13px;margin:6px 0}.step small{color:var(--muted)}.times{display:flex;gap:6px;margin-top:8px}.times span{background:#f1f4f8;padding:6px;border-radius:6px;font-size:11px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4}.note{padding:12px;background:#f1f6ff;border:1px solid #dce8ff;border-radius:9px;color:#40577d;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#17253688;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:white;border-radius:14px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:10px;border:0;border-bottom:1px solid var(--line)}.brand{padding:4px 8px 9px}.nav{display:flex;overflow:auto}.side button{white-space:nowrap;width:auto;font-size:11px;padding:8px}.top{height:48px;padding:0 12px}.wrap{padding:18px 12px}.head{display:block}.stats{grid-template-columns:1fr 1fr}.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>V</b>ValueStream Mapper</div><div class="nav" id="nav"><button class="active" data-p="dashboard">▦ Dashboard</button><button data-p="scope">◎ Stream scope</button><button data-p="workshop">▤ Workshop</button><button data-p="current">⇢ Current state</button><button data-p="analysis">◷ Analysis</button><button data-p="future">✧ Future state</button><button data-p="backlog">☷ Improvements</button><button data-p="portfolio">▥ Lean portfolio</button><button data-p="reports">⇩ Reports</button></div></aside><main><header class="top"><span id="crumb">Workspace / Dashboard</span><button class="btn" onclick="newStream()">＋ New stream</button></header><div class="wrap" id="view"></div></main></div><div class="modal" id="modal"><div class="dialog"><div class="section"><h2 id="mt">Activity</h2><button class="btn" onclick="closeModal()">✕</button></div><form id="mf"></form></div></div>
<script>
var P=[["Customer & business value","Customer needs, demand, outcomes"],["People & organization","Roles, skills, capacity, decision rights"],["Process & workflow","Activities, queues, handoffs, approvals"],["Technology & applications","Systems, integrations, automation"],["Data & information","Inputs, outputs, quality, ownership"],["Governance & controls","Policy, risk, compliance, decisions"],["Measures & performance","Lead time, cycle time, quality, service"],["Financial & investment","Costs, funding, benefits, trade-offs"]];
function uid(){return Math.random().toString(36).slice(2,10)}function fresh(){return{id:uid(),name:"New value stream",type:"Business",customer:"",owner:"",trigger:"",outcome:"",start:"",end:"",assumptions:"",pillars:P.map(function(p){return{name:p[0],desc:p[1],done:false,note:""}}),people:[],sessions:[],current:[],future:[],waste:[],backlog:[]}}
var sample=fresh();sample.name="Commercial claims resolution";sample.customer="Commercial policyholder";sample.owner="Claims Operations";sample.trigger="Claim reported";sample.outcome="Resolve a commercial claim accurately and communicate the decision.";sample.start="Claim reported";sample.end="Claim decision communicated";
sample.current=[["Claim intake","Claims intake",2,24,18,4,"Claims platform, portal","Value-added"],["Coverage verification","Policy services",1,48,12,8,"Policy and claims systems","Business-required"],["Adjuster assignment","Claims operations",2,72,24,2,"Claims platform","Business-required"],["Investigation","Adjuster",8,96,9,12,"Claims and document systems","Value-added"]].map(function(a){return{id:uid(),name:a[0],owner:a[1],process:a[2],wait:a[3],queue:a[4],rework:a[5],systems:a[6],value:a[7],description:"Review and complete this activity with the process owner.",dependencies:""}});sample.future=sample.current.map(function(a){return Object.assign({},a,{id:uid(),process:a.process*.8,wait:a.wait*.3,queue:Math.round(a.queue*.3)})});
var data;try{data=JSON.parse(localStorage.getItem("vsm1"))}catch(e){}if(!data||!data.streams)data={active:sample.id,streams:[sample]};var page="dashboard";
function save(){localStorage.setItem("vsm1",JSON.stringify(data))}function S(){return data.streams.find(function(x){return x.id===data.active})||data.streams[0]}function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function fmt(n){n=+n||0;return n<1?Math.round(n*60)+" min":n<24?(Math.round(n*10)/10)+" hrs":(n/24).toFixed(1)+" days"}function M(a){var p=a.reduce(function(t,x){return t+(+x.process||0)},0),w=a.reduce(function(t,x){return t+(+x.wait||0)},0);return{p:p,w:w,l:p+w,e:p+w?100*p/(p+w):0}}
function stat(a,b,c){return'<div class="card"><div class="statlabel">'+a+'</div><div class="stat">'+b+'</div><small class="muted">'+c+'</small></div>'}function head(k,t,d,b){return'<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'+(b||"")+'</div>'}
function go(p){page=p;document.querySelectorAll("[data-p]").forEach(function(b){b.classList.toggle("active",b.dataset.p===p)});render()}document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){go(b.dataset.p)}});
function render(){var x=S(),v="",m=M(x.current),f=M(x.future),btn='<button class="btn primary" onclick="addActivity()">＋ Add activity</button>';
if(page==="dashboard"){v=head("VALUE STREAM WORKSPACE","See the flow. Improve the system.","Facilitate discovery, map the real work, expose delays and turn future-state design into a portfolio of improvements.",'<button class="btn primary" onclick="go(\'workshop\')">Start workshop</button>')+'<div class="card"><b>'+esc(x.name)+'</b> <span class="pill">'+x.type+'</span><p class="muted">'+esc(x.customer)+' · Owner: '+esc(x.owner)+'</p><select onchange="switchS(this.value)">'+data.streams.map(function(z){return'<option value="'+z.id+'" '+(z.id===x.id?'selected':'')+'>'+esc(z.name)+'</option>'}).join("")+'</select></div><div class="grid stats">'+stat("Current lead time",fmt(m.l),"Processing + waiting")+stat("Flow efficiency",m.e.toFixed(1)+"%","Processing ÷ lead time")+stat("Future lead time",fmt(f.l),"Proposed target")+stat("Pillars reviewed",x.pillars.filter(function(p){return p.done}).length+"/8","Discovery dimensions")+'</div><div class="grid two"><div class="card"><h2>End-to-end method</h2>'+["Define customer, trigger and scope","Review eight value stream pillars","Facilitate discovery workshops","Map current state and validate facts","Measure lead time, queues and waste","Design future state and countermeasures","Prioritize initiatives and track outcomes"].map(function(t,i){return'<div class="row">'+(i+1)+'. '+t+'</div>'}).join("")+'</div><div class="card"><h2>Facilitator principle</h2><p class="note">Map the work as it actually happens across teams and systems—not the organization chart or ideal procedure. Separate touch time from elapsed waiting time. Validate with the people doing the work.</p><p class="muted">Future-state figures are targets, not achieved benefits.</p></div></div>'}
if(page==="scope"){v=head("FOUNDATION","Value stream scope","Agree the customer, trigger, outcome, boundaries and stakeholders.")+'<div class="grid two"><div class="card"><h2>Stream charter</h2><form id="sf"><div class="formgrid">'+field("name","Value stream name",x.name)+field("type","Type",x.type,"select","Business,Technology")+field("customer","Customer / recipient",x.customer)+field("owner","Value stream owner",x.owner)+field("trigger","Demand trigger",x.trigger)+field("outcome","Customer outcome",x.outcome,"textarea",true)+field("start","Scope start",x.start)+field("end","Scope end",x.end)+field("assumptions","Assumptions / exclusions",x.assumptions,"textarea",true)+'</div><button class="btn primary">Save charter</button></form></div><div class="card"><h2>Eight discovery pillars</h2><p class="muted">Discuss each dimension and record evidence, gaps and assumptions.</p>'+x.pillars.map(function(p,i){if(!p.entries)p.entries=p.note?[p.note]:[];return '<div class="check"><div style="width:100%"><b>'+p.name+'</b><small style="display:block">'+p.desc+'</small>'+p.entries.map(function(e,j){return '<div style="display:flex;gap:6px;margin:7px 0 0 20px"><input style="flex:1;min-width:0;padding:7px;border:1px solid #ddd;border-radius:6px" value="'+esc(e)+'" placeholder="Evidence, issue, idea or assumption" onchange="pillarEntry('+i+','+j+',this.value)"><button class="btn" onclick="removePillarEntry('+i+','+j+')">×</button></div>'}).join("")+'<button class="btn" style="margin:8px 0 0 20px" onclick="addPillarEntry('+i+')">＋ Add entry</button></div></div>'}).join("")+'</div></div><div class="section"><h2>Participants</h2><button class="btn" onclick="addPerson()">＋ Add participant</button></div><div class="card">'+x.people.map(function(p,i){return'<div class="row"><b>'+esc(p.name)+' · '+esc(p.role)+'</b><button class="btn" onclick="delPerson('+i+')">Remove</button></div>'}).join("")+'</div>'}
if(page==="workshop"){v=head("FACILITATION","Workshop manager","Run discovery and mapping sessions with prompts, attendance, observations and decisions.",'<button class="btn primary" onclick="addSession()">＋ Record workshop</button>')+'<div class="grid two"><div class="card"><h2>Facilitator run-of-show</h2>'+[["Set context","Confirm customer, trigger, scope and outcome."],["Walk the real work","Describe what actually happens, not what the procedure says."],["Capture handoffs","Record queues, systems, roles, approvals and exceptions."],["Measure flow","Separate touch time from waiting time; note evidence and confidence."],["Validate together","Check the map with people who perform and receive the work."],["Design future state","Eliminate, simplify, standardize, automate and improve."],["Agree actions","Assign owners, measures, due dates and dependencies."]].map(function(a,i){return'<div class="row"><b>'+(i+1)+'. '+a[0]+'</b><small class="muted">'+a[1]+'</small></div>'}).join("")+'</div><div class="card"><h2>Prompts</h2>'+["What creates value for the customer?","What starts the work and how much demand arrives?","Where does work wait, and why?","How many handoffs and approvals occur?","Where does rework or failure demand happen?","Which systems or data cause friction?","What would a better flow look like?"].map(function(q){return'<div class="row">'+q+'</div>'}).join("")+'</div></div><div class="section"><h2>Workshop records</h2></div><div class="card">'+x.sessions.map(function(a,i){return '<div class="row"><div><b>'+esc(a.title)+'</b> <span class="pill">'+esc(a.kind||"Workshop")+'</span><p class="muted">'+esc(a.date)+'</p><div style="margin:8px 0">'+(a.roles||[]).map(function(r){return '<span class="pill" style="margin:2px">'+esc(r.title)+' · '+esc(r.attendance)+'</span>'}).join("")+'</div>'+esc(a.notes)+'<p>Decisions: '+esc(a.decisions)+'</p></div><button class="btn" onclick="delSession('+i+')">Delete</button></div>'}).join("")+'</div>'}
if(page==="current"||page==="future"){var a=x[page];v=head(page==="current"?"OBSERVE THE REAL FLOW":"DESIGN THE IMPROVED FLOW",page==="current"?"Current-state map":"Future-state map",page==="current"?"Map the real sequence, queues, handoffs, systems and rework.":"Design the improved flow from current-state evidence; record proposed targets.",'<button class="btn" onclick="copyFuture()">Copy current → future</button> '+btn)+'<div class="grid stats">'+stat("Activities",a.length,"Mapped steps")+stat("Processing",fmt(M(a).p),"Touch time")+stat("Waiting",fmt(M(a).w),"Elapsed wait")+stat("Lead time",fmt(M(a).l),"Processing + waiting")+'</div><div class="card"><h2>Flow map</h2><div class="flowwrap"><div class="flow">'+a.map(function(z,i){return'<div class="step"><small>STEP '+(i+1)+' · '+esc(z.value)+'</small><h3>'+esc(z.name)+'</h3><p>'+esc(z.description)+'</p><small>Owner: '+esc(z.owner)+'</small><div class="times"><span>Process<br><b>'+fmt(z.process)+'</b></span><span>Wait<br><b>'+fmt(z.wait)+'</b></span></div><small>Queue '+z.queue+' · Rework '+z.rework+'%</small><p><button class="btn" onclick="editActivity(\''+z.id+'\')">Edit</button> <button class="btn" onclick="delActivity(\''+z.id+'\')">×</button></p></div>'}).join("")+'</div></div></div><div class="section"><h2>Activity register</h2></div><div class="card" style="overflow:auto"><table class="table"><tr><th>Activity</th><th>Owner</th><th>Process</th><th>Wait</th><th>Queue</th><th>Rework</th><th>Systems</th></tr>'+a.map(function(z){return'<tr><td>'+esc(z.name)+'</td><td>'+esc(z.owner)+'</td><td>'+fmt(z.process)+'</td><td>'+fmt(z.wait)+'</td><td>'+z.queue+'</td><td>'+z.rework+'%</td><td>'+esc(z.systems)+'</td></tr>'}).join("")+'</table></div>'}
if(page==="analysis"){v=head("MEASURE AND LEARN","Performance analysis","Expose the difference between active work and elapsed time; validate data before committing a baseline.")+'<div class="grid stats">'+stat("Lead time",fmt(m.l),"Current state")+stat("Processing time",fmt(m.p),"Current state")+stat("Waiting time",fmt(m.w),"Current state")+stat("Flow efficiency",m.e.toFixed(1)+"%","Processing ÷ lead time")+'</div><div class="grid two"><div class="card"><h2>Current vs future</h2>'+bar("Current lead",m.l,m.l)+bar("Future lead",f.l,m.l)+bar("Current wait",m.w,m.l)+bar("Future wait",f.w,m.l)+'<p class="note">This MVP sums step processing and wait times. If work runs in parallel or waits overlap, totals may overstate actual elapsed lead time. Validate timestamps and flow logic.</p></div><div class="card"><h2>Waste observations</h2><button class="btn" onclick="addWaste()">＋ Add observation</button>'+x.waste.map(function(w,i){return'<div class="row"><div><b>'+esc(w.type)+' · '+esc(w.title)+'</b><p>'+esc(w.evidence)+' · '+esc(w.owner)+'</p></div><button class="btn" onclick="delWaste('+i+')">×</button></div>'}).join("")+'</div></div>'}
if(page==="backlog"||page==="portfolio"){v=head(page==="portfolio"?"LEAN PORTFOLIO":"COUNTERMEASURES",page==="portfolio"?"Lean portfolio roadmap":"Improvement backlog",page==="portfolio"?"Connect value stream outcomes to initiatives, capacity, dependencies and investment decisions.":"Convert observed constraints into owned improvements with measurable outcomes.",'<button class="btn primary" onclick="addItem()">＋ Add improvement</button>')+'<div class="grid stats">'+stat("Work items",x.backlog.length,"Ideas, epics and initiatives")+stat("High priority",x.backlog.filter(function(z){return z.priority==="High"}).length,"Needs attention")+stat("In progress",x.backlog.filter(function(z){return z.status==="In progress"}).length,"Active delivery")+stat("Blocked",x.backlog.filter(function(z){return z.status==="Blocked"}).length,"Decision / dependency")+'</div><div class="card" style="overflow:auto"><table class="table"><tr><th>Improvement</th><th>Type</th><th>Owner</th><th>Priority</th><th>Status</th><th>Outcome</th><th>Dependency</th></tr>'+x.backlog.map(function(z,i){return'<tr><td><b>'+esc(z.title)+'</b></td><td>'+esc(z.type)+'</td><td>'+esc(z.owner)+'</td><td>'+esc(z.priority)+'</td><td><select onchange="status('+i+',this.value)">'+["Proposed","Ready","In progress","Blocked","Done"].map(function(q){return'<option '+(z.status===q?'selected':'')+'>'+q+'</option>'}).join("")+'</select></td><td>'+esc(z.benefit)+'</td><td>'+esc(z.dependency)+'</td></tr>'}).join("")+'</table></div><p class="note">Prioritize using customer value, cost of delay, risk, capacity and dependencies. Fund based on outcomes and flow—not simply project count.</p>'}
if(page==="reports"){v=head("SHARE THE OUTCOME","Reports and exports","Portable project record for review, steering discussions and implementation.")+'<div class="grid two"><div class="card"><h2>'+esc(x.name)+'</h2><p>'+esc(x.outcome)+'</p><p class="muted">'+esc(x.type)+' · '+esc(x.customer)+' · '+esc(x.owner)+'</p>'+stat("Current lead",fmt(m.l),"Baseline")+stat("Future lead",fmt(f.l),"Target design")+'</div><div class="card"><h2>Export project</h2><p class="muted">Download project snapshot or activity CSVs.</p><button class="btn primary" onclick="exportJSON()">Project JSON</button> <button class="btn" onclick="exportCSV(\'current\')">Current CSV</button> <button class="btn" onclick="exportCSV(\'future\')">Future CSV</button> <button class="btn" onclick="exportCSV(\'backlog\')">Backlog CSV</button><p class="note">Data is stored in this browser only. Shared database, authentication and multi-user collaboration are not yet included.</p></div></div>'}
document.getElementById("view").innerHTML=v;document.getElementById("crumb").textContent="Workspace / "+page}
function field(n,l,v,t,full){var c='<div class="field '+(full?'full':'')+'"><label>'+l+'</label>';if(t==="textarea")c+='<textarea name="'+n+'">'+esc(v)+'</textarea>';else if(t==="select")c+='<select name="'+n+'"><option '+(v==="Business"?"selected":"")+'>Business</option><option '+(v==="Technology"?"selected":"")+'>Technology</option></select>';else c+='<input name="'+n+'" value="'+esc(v)+'">';return c+'</div>'}
function bar(t,v,max){return'<div class="row"><span>'+t+'</span><span style="width:42%;background:#edf1f6;border-radius:8px;height:8px"><i style="display:block;height:8px;background:#4c82e9;border-radius:8px;width:'+(max?Math.min(100,v/max*100):0)+'%"></i></span><b>'+fmt(v)+'</b></div>'}
function switchS(id){data.active=id;save();render()}function newStream(){var n=prompt("Value stream name");if(!n)return;var z=fresh();z.name=n;z.type=confirm("Business stream? Cancel for Technology.")?"Business":"Technology";data.streams.push(z);data.active=z.id;save();render()}
document.addEventListener("submit",function(e){if(e.target.id==="sf"){e.preventDefault();Object.assign(S(),Object.fromEntries(new FormData(e.target)));save();render()}});
function pillar(i,k,v){S().pillars[i][k]=v;save();render()}function addPillarEntry(i){if(!S().pillars[i].entries)S().pillars[i].entries=S().pillars[i].note?[S().pillars[i].note]:[];S().pillars[i].entries.push("");save();render()}function pillarEntry(i,j,v){S().pillars[i].entries[j]=v;save()}function removePillarEntry(i,j){S().pillars[i].entries.splice(j,1);save();render()}function addPerson(){var n=prompt("Participant name");if(!n)return;S().people.push({name:n,role:prompt("Role")||"Participant"});save();render()}function delPerson(i){S().people.splice(i,1);save();render()}
function addSession(){var title=prompt("Meeting title");if(!title)return;var kind=prompt("Meeting type: Kickoff, Discovery, Current-state mapping, Current-state validation, Future-state design, Prioritization, Leadership playback","Discovery")||"Discovery";var defaults={"Kickoff":[["Executive sponsor","Mandatory"],["Value stream owner","Mandatory"],["Business process owner","Mandatory"],["Technology lead / architect","Mandatory"],["Facilitator","Mandatory"],["Product owner","Optional"],["Risk / compliance lead","Optional"]],"Discovery":[["Value stream owner","Mandatory"],["Process owner","Mandatory"],["Frontline subject matter experts","Mandatory"],["Facilitator","Mandatory"],["Business analyst / product owner","Mandatory"],["Solution architect","Optional"],["Data / reporting lead","Optional"],["Risk / compliance SME","Optional"]],"Current-state mapping":[["Process owner","Mandatory"],["Frontline process participants","Mandatory"],["Facilitator","Mandatory"],["Business analyst","Mandatory"],["Application / integration SME","Mandatory"],["Product owner","Optional"]],"Current-state validation":[["Value stream owner","Mandatory"],["Process owner","Mandatory"],["Frontline representatives","Mandatory"],["Technology / system owners","Mandatory"],["Business analyst","Mandatory"]],"Future-state design":[["Value stream owner","Mandatory"],["Process owner","Mandatory"],["Frontline representatives","Mandatory"],["Product owner","Mandatory"],["Solution architect","Mandatory"],["Data / integration lead","Mandatory"],["Risk / compliance","Optional"],["Finance / benefits lead","Optional"]],"Prioritization":[["Business sponsor","Mandatory"],["Value stream owner","Mandatory"],["Product / initiative owners","Mandatory"],["Technology lead","Mandatory"],["Finance / portfolio lead","Mandatory"],["Risk / compliance","Optional"]],"Leadership playback":[["Executive sponsor / decision-maker","Mandatory"],["Value stream owner","Mandatory"],["Business process owner","Mandatory"],["Technology
